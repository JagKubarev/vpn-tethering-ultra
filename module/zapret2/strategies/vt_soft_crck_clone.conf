# vt_soft_crck_clone — Kubarev, 26.11.2026: vt_soft_crck, но подделка TLS-части — клон настоящего ClientHello
# этого соединения (tls_client_hello_clone, zapret-antidpi.lua; приём из circular/exp5 nfqws2-android): шифры,
# расширения, их порядок и размер — как у подключающегося приложения, а не у готового ClientHello Google.
# tls_mod=rnd — свой random и session id (иначе клон совпал бы с настоящим до байта, кроме имени: две копии с
# одним random в потоке выдают подделку), sni= — выбранное имя (ZAPRET2_FAKE_SNI подменяет его, как у
# tls_google). Не склонировалось — подделка Google (fallback). 20.11 на YOTA клон = vt_soft_crck (28/30):
# сейчас ТСПУ подделки по отпечатку не различает — запасной вариант на случай, если начнёт.
IFACE_EXCLUDE="lo tun+ tap+ wg+ ppp+ ipsec+ ifb+ dummy+"
ISP_INTERFACE=""

NFQWS_BASE_ARGS="--lua-init=@$LUA_DIR/zapret-lib.lua 
--lua-init=@$LUA_DIR/zapret-antidpi.lua 
--lua-init=@$LUA_DIR/zapret-auto.lua 
--lua-init=@$LUA_DIR/custom_funcs.lua 
--blob=tls_google:@$BLOBS_DIR/tls_clienthello_www_google_com.bin 
--blob=tls_4pda:@$BLOBS_DIR/tls_clienthello_4pda_to.bin 
--blob=quic_google:@$BLOBS_DIR/quic_initial_www_google_com.bin 
--blob=discord_udp:@$BLOBS_DIR/quic_initial_steamcommunity_com.bin"

NFQWS_ARGS="--filter-tcp=80,443 --filter-l7=http,tls 
--payload=tls_client_hello 
--lua-desync=tls_client_hello_clone:blob=ch_clone:fallback=tls_google
--lua-desync=fake:blob=ch_clone:tls_mod=rnd,sni=xn--80aneakq8a4c.xn--p1ai:ip_autottl=-1,3-20:ip6_autottl=-1,3-20:repeats=2:tcp_ack=-66000
--lua-desync=multidisorder:pos=1,sniext+1,host+1,midsld-2,midsld,midsld+2,endhost-1 
--payload=http_req 
--lua-desync=fake:blob=tls_google:tls_mod=sni=xn--80aneakq8a4c.xn--p1ai:ip_autottl=-1,3-20:repeats=2:tcp_ack=-66000 "

NFQWS_ARGS_QUIC="--filter-udp=443 --filter-l7=quic 
--payload=quic_initial 
--lua-desync=fake:blob=quic_google:ip_autottl=-2,3-20:ip6_autottl=-2,3-20:repeats=8"

NFQWS_ARGS_UDP="--filter-udp=3478-3481,19294-19344,50000-65535 --filter-l7=discord,stun 
--payload=discord_ip_discovery,stun 
--lua-desync=fake:blob=discord_udp:repeats=6 
--lua-desync=udplen:increment=2:min=64"

MODE_LIST="--hostlist=$LISTS_DIR/user.list"
MODE_ALL="--hostlist-exclude=$LISTS_DIR/exclude.list"
MODE_AUTO="$MODE_LIST --hostlist-auto=$LISTS_DIR/auto.list --hostlist-auto-debug=$LOG_DIR/auto.log $MODE_ALL"
NFQWS_EXTRA_ARGS="$MODE_AUTO"
NFQWS_ARGS_IPSET="--ipset=$LISTS_DIR/ipset.list --ipset-exclude=$LISTS_DIR/ipset_exclude.list"

# vt_soft_crck — Kubarev (VPN Tethering Ultra), 16.11.2026. «soft» — мягкий старт: первое видеосоединение ждёт
# ~0,5 с, дальше идёт полным ходом (2K на YOTA). Основа — universal_v12 (2 подделки, своя нарезка), видео — профиль hardcorp74.
# Подделка TLS-части (сайты, API YouTube) — ClientHello www.google.com с именем защитник.рф (tls_mod=sni, punycode);
# с 26.11 ещё rnd,dupsid — random свой на каждое соединение, session id как у настоящего ClientHello (как у 50+
# стратегий из nfqws-menu): одинаковые байты подделки ТСПУ мог бы узнать; HTTP-подделка (ниже) — без них:
# 15–16.11 на стенде .рф-имена открывали больше сайтов (32–33 из 34 против 26–27 у google: agents.media,
# cherta.media, kavkaz-uzel.eu), скорость без потолка; 16.11 подмену убирали («YouTube на деле хуже» — было с
# контрактцентр.рф), 18.11 вернули: с защитником YouTube в порядке. Другое имя — настройка ZAPRET2_FAKE_SNI (WebUI,
# «Тонкая настройка стратегии»), пусто — это. Видеопрофиль (ниже) — без имени: с ним стойки 0 из 38 (15.11).
#
# Свой набор модуля (15.11, YOTA): universal_v12 с 2 подделками вместо 6 для сайтов (проба 15.11: так лучше; без перекрытия 4pda — не лучше, 3 разреза — хуже, разрез из hardcorp74 — нормально, 11 мест — не лучше),
# а видеосерверам (googlevideo.com) — профиль hardcorp74.
# Коробка оператора около 6-го хопа режет соединение с видео, если её проходят 3 подделки и больше
# (TTL 8, 15 «плохих» стоек: 1 — 5 из 30, 2 — 12, 3/4/6 — 0); у universal_v12 (как у anti_throttle) их 6, и кэш YOTA и часть
# стоек не открывались вовсе. Две нулевые подделки + разрез посередине имени: 29 живых серверов —
# 100 из 116 (anti_throttle 36, она же с TTL подделки до 5 — 74), кэш 16 из 16
# Проба 17.11: тот же профиль — загрузкам Play (gvt1.com) и картинкам (googleusercontent.com: фото постов YouTube).
# Без него они шли общим профилем по адресу Google (ipset), и Play на волне ТСПУ висел на 96%. Стенд (4 адреса, хвост
# волны): gvt1 — без обхода 1 из 4, общий профиль 4, этот 4; googleusercontent — 4, 2, 4. Один прогон — проба, не замер
NFQWS_ARGS_CUSTOM="--filter-tcp=443 --filter-l7=tls
--hostlist-domains=googlevideo.com,gvt1.com,googleusercontent.com
--payload=tls_client_hello
--lua-desync=fake:blob=0x00000000:tcp_ack=-66000:tcp_ts_up:repeats=2
--lua-desync=multisplit:pos=midsld"

# Поддельный SYN-ACK клиента перед его SYN (synack из zapret-antidpi.lua, 2 копии; из z_attacker, где он стоит под
# --payload=tls_client_hello и не срабатывает): ТСПУ, видимо, путает стороны соединения и ClientHello смотрит хуже.
# Сервер отвечает на него RST без ACK — клиент такой не принимает, и рукопожатие идёт обычным SYN. 16.11 YOTA, стенд
# t36: TLS 0,29 с против 0,55, Google/YouTube 12 из 12 против 11, стойки 9 из 9 против 8, волн нет; вживую на 13T
# с 16.11 («видео открываются очень шустро»). Модуль ставит его последним профилем (NFQWS_ARGS_SYN — наше расширение);
# стойкам малого окна не нужен (t37: 27 из 28 против 26)
NFQWS_ARGS_SYN="--payload=empty --lua-desync=synack:repeats=2"

IPV6_ENABLED=1
TCP_PORTS=80,443,1984,2053,2083,2087,2096,5222,8443
UDP_PORTS=443,590:600,1400,3478:3481,5349,19294:19344,49152:65535
NFQUEUE_NUM=300

PKT_LIMIT_OUT=15
PKT_LIMIT_IN=15

BLOCK_QUIC=0
NAT_FIX=1
APP_MODE=off
AUTOSTART=1
WATCHDOG=1

NFQWS_USER=root
LOG_LEVEL=0
LOG_MAX_KB=512
