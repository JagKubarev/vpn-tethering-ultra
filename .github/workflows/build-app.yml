# Приложение «VPN Tether» — WebUI модуля без менеджера KernelSU (app/, GPL-3.0).
# Подпись: секреты VT_KEYSTORE_B64 (keystore в base64), VT_KEYSTORE_PASS, VT_KEY_ALIAS
# (+ VT_KEY_PASS, если пароль ключа другой).
# Без них APK подписан отладочным ключом раннера — ставится, но поверх такого
# же APK из другого запуска не встанет (другой ключ): тогда удалить и поставить заново.
name: build-app

on:
  workflow_dispatch:
  push:
    paths: ['app/**', '.github/workflows/build-app.yml']

env:
  GRADLE_VER: '8.7'
  GRADLE_SHA256: 544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle — сами, с кэшем: дистрибутив лежит только в релизах GitHub
      # (gradle/gradle-distributions), а они 08.11 часами отдавали 504.
      # Скачался один раз — дальше берётся из кэша Actions.
      - uses: actions/cache@v4
        with:
          path: ~/gradle-dist
          key: gradle-${{ env.GRADLE_VER }}-bin

      - name: Gradle
        run: |
          d=~/gradle-dist; z="$d/gradle-$GRADLE_VER-bin.zip"
          mkdir -p "$d"
          if [ ! -d "$d/gradle-$GRADLE_VER" ]; then
            curl -fsSL --retry 6 --retry-delay 20 --retry-all-errors -o "$z" \
              "https://services.gradle.org/distributions/gradle-$GRADLE_VER-bin.zip"
            echo "$GRADLE_SHA256  $z" | sha256sum -c -
            unzip -q "$z" -d "$d" && rm -f "$z"
          fi
          echo "$d/gradle-$GRADLE_VER/bin" >> "$GITHUB_PATH"

      - name: Ключ подписи
        env:
          KS_B64: ${{ secrets.VT_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.VT_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.VT_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.VT_KEY_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            # ключ есть, а пароля или alias нет — ошибка, а не тихая отладочная подпись
            [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ] || { echo "::error::есть VT_KEYSTORE_B64, но нет VT_KEYSTORE_PASS или VT_KEY_ALIAS"; exit 1; }
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/vt.jks"
            { echo "VT_KEYSTORE=$RUNNER_TEMP/vt.jks"; echo "VT_KEYSTORE_PASS=$KS_PASS"; echo "VT_KEY_ALIAS=$KS_ALIAS"; echo "VT_KEY_PASS=$KEY_PASS"; } >> "$GITHUB_ENV"
          else
            echo "::warning::нет секрета VT_KEYSTORE_B64 — APK подписан отладочным ключом"
          fi

      - name: Сборка
        working-directory: app
        run: gradle --no-daemon assembleRelease

      - name: Имя с версией
        run: |
          v=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/VPN_Tether_WebUI-release.apk "out/VPN_Tether_WebUI_v$v.apk"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # проверка отдельно от вывода: через | head код ошибки apksigner терялся бы
          "$bt"/apksigner verify out/*.apk
          "$bt"/apksigner verify --print-certs out/*.apk | head -3
          sha256sum out/*.apk | tee out/SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: vpn-tether-webui
          path: out/
